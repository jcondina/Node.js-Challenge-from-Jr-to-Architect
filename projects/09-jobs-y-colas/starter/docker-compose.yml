services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: project_09
    ports:
      - "5409:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d project_09"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6309:6379"
